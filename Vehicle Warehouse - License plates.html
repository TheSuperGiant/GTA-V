{% include header.html %}
	<style>
		#search { padding: 4px; width: 200px; }

		.table-container {
			display: flex;
			flex-wrap: nowrap;
			overflow-x: auto;
			margin: 0;
			padding: 0;
		}

		.block-table {
			flex: 1 1 18%;
			max-width: 200px;
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		.block-table:nth-child(1) { flex-basis: 25%; }
		.block-table:nth-child(2) { flex-basis: 10%; }
		.block-table:nth-child(3) { flex-basis: 12%; }
		.block-table:nth-child(4) { flex-basis: 18%; }
		.block-table:nth-child(5) { flex-basis: 18%; }

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th {
			border-top: 1px solid black;
			border-bottom: 1px solid black;
			border-right: 1px solid black;
			text-align: center;
			height: 40px;
			line-height: 40px;
			cursor: pointer;
			position: relative;
			padding-right: 20px;
		}

		.block-table:first-child th {
			border-left: 1px solid black;
		}

		tbody td {
			border-top: 1px solid black;
			border-bottom: 1px solid black;
			border-right: 1px solid black;
			text-align: left;
			padding: 4px 20px 4px 4px;
			vertical-align: top;
		}

		.block-table:first-child td {
			border-left: 1px solid black;
		}

		th:hover { background-color: #eee; }

		.arrow-box {
			position: absolute;
			right: 6px;
			top: 50%;
			transform: translateY(-50%);
			display: inline-flex;
			flex-direction: column;
			font-size: 10px;
			line-height: 1;
		}

		.arrow-up, .arrow-down { color: black; }
		.active { color: orange; }

		.header-row {
			display: flex;
			align-items: center;
			max-width: 1000px;
		}

		.header-row h1 {
			margin: 0;
			font-size: 40px;
			position: relative;
			top: -1px;
		}

		.header-row h1 a {
			text-decoration: none;
		}

		.header-row input {
			font-size: 16px;
			margin-left: auto;
		}

		.container {
			display: flex;
			justify-content: center;
		}
	</style>
</head>
<body>

		let filteredData = [...rowData];
		const containers = document.querySelectorAll("#linked-tables .block-table");
		let lastSortCol = null, sortAsc = true;

		document.getElementById("search").addEventListener("input", e => {
			const raw = e.target.value.trim().toLowerCase();
			filteredData = rowData.filter(row =>
			row.some((cell, i) => {
				let text = String(cell).toLowerCase();
				if (i === 2) {
					text = text.replace(/[0o]/g,"o").replace(/[1i]/g,"i").replace(/[3e]/g,"e");
					return text.includes(raw.replace(/[0o]/g,"o").replace(/[1i]/g,"i").replace(/[3e]/g,"e"));
				}
				return text.includes(raw);
			})
			);
			renderRows(filteredData);
		});

		function renderRows(data) {
			containers.forEach((div, col) => {
				const tbody = div.querySelector("tbody");
				tbody.innerHTML = "";
				data.forEach(row => {
					const tr = document.createElement("tr");
					tr.innerHTML = `<td>${row[col] || ""}</td>`;
					tbody.appendChild(tr);
				});
			});
			syncRowHeights();
		}

		function sortLinked(col) {
			if (col === lastSortCol) sortAsc = !sortAsc;
			else { lastSortCol = col; sortAsc = true; }
			filteredData.sort((a,b) => {
				let x = String(a[col]).toLowerCase();
				let y = String(b[col]).toLowerCase();
				if (!x && y) return 1;
				if (!y && x) return -1;
				if (col === 2) {
					x = x.replace(/[0o]/g,"o").replace(/[1i]/g,"i");
					y = y.replace(/[0o]/g,"o").replace(/[1i]/g,"i");
				}
				return sortAsc ? x.localeCompare(y) : y.localeCompare(x);
			});
			renderRows(filteredData);
			updateHeaders();
		}

		function updateHeaders() {
			containers.forEach((div,i) => {
				div.querySelector(".arrow-up").classList.toggle("active", i===lastSortCol && sortAsc);
				div.querySelector(".arrow-down").classList.toggle("active", i===lastSortCol && !sortAsc);
			});
		}

		function syncRowHeights() {
			const rows = [];
			containers.forEach(div => {
				div.querySelectorAll("tbody tr").forEach((tr, i) => {
					if (!rows[i]) rows[i] = [];
					rows[i].push(tr);
				});
			});

			rows.forEach(group =>
				group.forEach(tr => tr.style.height = "auto")
			);

			rows.forEach(group => {
				const maxH = Math.ceil(
					Math.max(...group.map(tr =>
						tr.getBoundingClientRect().height
					))
				);
				group.forEach(tr => tr.style.height = maxH + "px");
			});
		}

		const observer = new ResizeObserver(syncRowHeights);
		document.querySelectorAll("tbody tr").forEach(tr => observer.observe(tr));

		window.addEventListener("resize", syncRowHeights);

		syncRowHeights();

		renderRows(filteredData);
	</script>
